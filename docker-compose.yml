# Infraestrutura local de desenvolvimento.
# Em produção estes serviços são gerenciados — ver docs/ARQUITETURA.md
#
#   docker compose up -d
#   docker compose down          (mantém os dados)
#   docker compose down -v       (apaga os dados)

services:
  postgres:
    image: postgres:16-alpine
    container_name: cacia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cacia
      POSTGRES_PASSWORD: cacia
      POSTGRES_DB: cacia
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cacia -d cacia']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cacia-redis
    restart: unless-stopped
    # appendonly garante que as filas sobrevivam a um restart do contêiner
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cacia-qdrant
    restart: unless-stopped
    ports:
      - '6333:6333' # REST
      - '6334:6334' # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_TLS: 'false'

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
