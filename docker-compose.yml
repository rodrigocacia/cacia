# Infraestrutura local de desenvolvimento.
#
# As portas do host saem das padrões de propósito: a mesma máquina costuma
# rodar outros projetos com Postgres e Redis, e o conflito de porta só
# aparece na hora de subir. Dentro da rede do compose as portas são as
# padrões — muda apenas o que é exposto ao host.
# Em produção estes serviços são gerenciados — ver docs/ARQUITETURA.md
#
#   docker compose up -d
#   docker compose down          (mantém os dados)
#   docker compose down -v       (apaga os dados)

services:
  postgres:
    image: postgres:16-alpine
    container_name: cacia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cacia
      POSTGRES_PASSWORD: cacia
      POSTGRES_DB: cacia
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cacia -d cacia']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cacia-redis
    restart: unless-stopped
    # appendonly garante que as filas sobrevivam a um restart do contêiner
    command: redis-server --appendonly yes
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cacia-qdrant
    restart: unless-stopped
    ports:
      - '6333:6333' # REST
      - '6334:6334' # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_TLS: 'false'

  # Storage compatível com S3 — o mesmo protocolo do Cloudflare R2 usado em
  # produção. Aceita qualquer credencial e já nasce com o bucket "cacia".
  # (As imagens públicas do MinIO foram descontinuadas; o S3Mock é feito
  # justamente para desenvolvimento e teste.)
  storage:
    image: adobe/s3mock:latest
    container_name: cacia-storage
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: cacia
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    ports:
      - '9000:9090'
    volumes:
      - storage_data:/s3mockroot

volumes:
  storage_data:
  postgres_data:
  redis_data:
  qdrant_data:
