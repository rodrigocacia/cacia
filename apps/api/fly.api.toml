# Deploy:  fly deploy -c apps/api/fly.api.toml --dockerfile apps/api/Dockerfile
app            = "cacia-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT     = "8080"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "suspend"
  auto_start_machines  = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period  = "20s"
    interval      = "15s"
    method        = "GET"
    timeout       = "5s"
    path          = "/health/ready"

[[vm]]
  size   = "shared-cpu-2x"
  memory = "2gb"
