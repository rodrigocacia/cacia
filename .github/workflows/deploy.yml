name: Deploy

# Só publica o que mudou. Cada job tem seu filtro de caminho, então uma
# alteração no frontend não redeploya a API — e vice-versa.
#
# NÃO DISPARA SOZINHO — DE PROPÓSITO.
#
# Não existe ainda staging nem produção: o environment `producao` está vazio,
# sem nenhum secret, e não há aplicação criada no Fly nem projeto no Cloudflare.
# Enquanto for assim, um `push` em `main` só produziria uma falha vermelha a
# cada merge.
#
# O risco de verdade é o dia seguinte ao cadastro do primeiro secret: com o
# gatilho automático de volta, todo merge em `main` publicaria direto em
# produção, sem nada no meio. Por isso a publicação é manual até que exista
# staging para receber primeiro.
#
# PARA REATIVAR, quando houver staging e produção:
#   1. criar os environments e os secrets de cada um;
#   2. exigir revisor no environment de produção — esse é o freio de verdade;
#   3. devolver o gatilho, apontando `dev` para staging e `main` para produção.
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: 'O que publicar'
        required: true
        type: choice
        options: [api, worker, web, backoffice, todos]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # deploy não se cancela no meio

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'

jobs:
  mudancas:
    name: O que mudou
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filtro.outputs.api }}
      web: ${{ steps.filtro.outputs.web }}
      backoffice: ${{ steps.filtro.outputs.backoffice }}
    steps:
      - uses: actions/checkout@v4

      # O filtro por caminho só faz sentido comparando com o commit anterior,
      # o que exige um `push`. No disparo manual ele fica de fora e quem decide
      # o que publicar é o campo `alvo` — as condições dos jobs já tratam o
      # resultado vazio. Volta a valer sozinho quando o gatilho de push voltar.
      - uses: dorny/paths-filter@v3
        id: filtro
        if: github.event_name == 'push'
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
            web:
              - 'apps/web/**'
              - 'packages/contracts/**'
            backoffice:
              - 'apps/backoffice/**'
              - 'packages/contracts/**'

  migracao:
    name: Aplicar migrations
    needs: mudancas
    if: needs.mudancas.outputs.api == 'true' || inputs.alvo == 'api' || inputs.alvo == 'todos'
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Antes do deploy, sempre: código novo pode depender de coluna nova, mas
      # código antigo nunca depende de coluna que ainda não existe.
      - name: Migrations
        run: pnpm --filter @cacia/database migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  api:
    name: API e worker
    needs: [mudancas, migracao]
    if: needs.mudancas.outputs.api == 'true' || inputs.alvo == 'api' || inputs.alvo == 'todos'
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Publicar API
        run: flyctl deploy -c apps/api/fly.api.toml --dockerfile apps/api/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Publicar worker
        run: flyctl deploy -c apps/api/fly.worker.toml --dockerfile apps/api/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  web:
    name: Frontend
    needs: mudancas
    if: needs.mudancas.outputs.web == 'true' || inputs.alvo == 'web' || inputs.alvo == 'todos'
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publicar no Cloudflare
        run: pnpm --filter @cacia/web cf:deploy
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          # Lido pelo painel ao limpar sessão expirada; ausente no build, a
          # chamada ia para "undefined/api/auth/reset"
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  backoffice:
    name: Backoffice
    needs: mudancas
    if: needs.mudancas.outputs.backoffice == 'true' || inputs.alvo == 'backoffice' || inputs.alvo == 'todos'
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publicar no Cloudflare
        run: pnpm --filter @cacia/backoffice cf:deploy
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
