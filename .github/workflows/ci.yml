name: CI

# `dev` é o branch de integração: todo trabalho entra por PR nele. O `main`
# continua na lista porque é para lá que o `dev` vai quando houver produção.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Um push novo cancela a execução anterior do mesmo branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  # O Prisma exige a variável para gerar o client, mesmo sem conectar
  DATABASE_URL: 'postgresql://cacia:cacia@localhost:5432/cacia?schema=public'
  # Os frontends leem esta variável em tempo de build
  NEXT_PUBLIC_API_URL: 'http://localhost:3000'

jobs:
  verificacao:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Testes
        run: pnpm test

  e2e:
    name: Ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Banco e Redis de verdade. É o ponto do teste de ponta a ponta: dublar o
    # Prisma esconderia justamente o que se quer verificar — uma query
    # inválida, um índice único que dispara, um enum inexistente.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cacia
          POSTGRES_PASSWORD: cacia
          POSTGRES_DB: cacia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cacia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Schema dedicado: a suíte trunca todas as tabelas do schema em que roda,
      # e o harness recusa rodar no `public` por isso mesmo.
      DATABASE_URL_E2E: 'postgresql://cacia:cacia@localhost:5432/cacia?schema=e2e'
      REDIS_HOST: localhost
      REDIS_PORT: '6379'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # A API importa @cacia/database e @cacia/contracts pelo `dist` deles.
      # Sem este passo o Vitest não resolve os pacotes — o `postinstall` só
      # gera o client do Prisma, não compila o TypeScript.
      - name: Compilar os pacotes internos
        run: pnpm turbo run build --filter=@cacia/database --filter=@cacia/contracts

      - name: Testes de ponta a ponta
        run: pnpm test:e2e

  migracao:
    name: Migration em Postgres real
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cacia
          POSTGRES_PASSWORD: cacia
          POSTGRES_DB: cacia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cacia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Aplica as migrations do zero: prova que o banco pode ser reconstruído
      - name: Aplicar migrations
        run: pnpm --filter @cacia/database migrate:deploy

      # Se o schema divergir das migrations, o diff não fica vazio e falha aqui.
      # É o que impede alguém editar o schema e esquecer de gerar a migration.
      - name: Verificar que schema e migrations estão sincronizados
        run: |
          cd packages/database
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

  seguranca:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Falha em vulnerabilidade alta ou crítica. Instabilidade de rede com o
      # registro npm não reprova o PR: seria uma falha que não diz nada sobre
      # o código, e o time aprenderia a ignorar o job vermelho.
      - name: Auditoria
        # O retry interno do pnpm usa backoff longo: cada tentativa levava ~4
        # minutos só esperando o socket, e o job estourava o limite antes de
        # concluir. Aqui ela falha rápido e o retry fica sob nosso controle.
        env:
          NPM_CONFIG_FETCH_RETRIES: '0'
          NPM_CONFIG_FETCH_TIMEOUT: '30000'
        run: |
          for tentativa in 1 2 3; do
            saida=$(pnpm audit --audit-level high 2>&1) && exit 0
            if echo "$saida" | grep -qE 'ERR_SOCKET_TIMEOUT|FetchError|ECONNRESET|ETIMEDOUT|ERR_PNPM_AUDIT'; then
              echo "::warning::Tentativa $tentativa: registro npm indisponível"
              sleep $((tentativa * 10))
              continue
            fi
            echo "$saida"
            echo "::error::Vulnerabilidade alta ou crítica encontrada"
            exit 1
          done
          echo "::warning::Auditoria inconclusiva — registro npm fora do ar após 3 tentativas"
