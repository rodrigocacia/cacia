# WAHA — WhatsApp HTTP API
#
# Deploy:  fly deploy -c infra/waha/fly.toml
#
# Três coisas aqui não podem mudar sem quebrar a operação:
#
#   1. O volume. As credenciais de sessão do WhatsApp ficam em disco. Sem
#      volume, todo restart derruba as sessões e exige novo QR Code de cada
#      número — em um deploy comum, isso para o atendimento inteiro.
#
#   2. auto_stop_machines = "off". O WAHA mantém socket aberto com o WhatsApp.
#      Se o Fly suspender a máquina, as sessões caem.
#
#   3. Uma máquina só. O volume é preso a uma máquina e duas instâncias não
#      compartilham sessão. O ponto único de falha é mitigado pelo fallback
#      para a Evolution API, que já existe na aplicação.

app            = "cacia-waha-prod"
primary_region = "gru"

[build]
  image = "devlikeapro/waha:latest"

[env]
  # GOWS é o motor leve. O baseado em Chromium consumiria 1-2 GB POR SESSÃO.
  WHATSAPP_DEFAULT_ENGINE   = "GOWS"
  WHATSAPP_RESTART_ALL_SESSIONS = "true"
  WAHA_PRINT_QR             = "false"
  # Guarda as sessões no volume, não no diretório efêmero do contêiner
  WHATSAPP_SESSIONS_MONGO_URL = ""
  WAHA_MEDIA_STORAGE        = "LOCAL"
  WAHA_LOCAL_STORE_BASE_DIR = "/app/.sessions"

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = "off"
  auto_start_machines  = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval     = "20s"
    method       = "GET"
    timeout      = "10s"
    path         = "/ping"

[[mounts]]
  source      = "waha_sessions"
  destination = "/app/.sessions"

[[vm]]
  size   = "shared-cpu-2x"
  memory = "2gb"
